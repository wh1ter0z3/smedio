<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 2012-era glossy app tile: dark "S" over a red "medio" box -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f0f0f0"/>
      <stop offset="1" stop-color="#d4d4d4"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ea4b43"/>
      <stop offset="0.5" stop-color="#cc181e"/>
      <stop offset="1" stop-color="#9c0e12"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d4d4d"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#tile)" stroke="#b5b5b5" stroke-width="1.5"/>
  <text x="64" y="59" text-anchor="middle" fill="url(#ink)" font-size="52" font-weight="bold"
        font-family="Liberation Sans Narrow, Nimbus Sans Narrow, DejaVu Sans Condensed, sans-serif">S</text>
  <rect x="16" y="64" width="96" height="46" rx="11" fill="url(#red)"/>
  <rect x="18" y="66" width="92" height="20" rx="9" fill="url(#gloss)"/>
  <text x="64" y="99" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold" letter-spacing="-1"
        font-family="Liberation Sans Narrow, Nimbus Sans Narrow, DejaVu Sans Condensed, sans-serif">medio</text>
</svg>
